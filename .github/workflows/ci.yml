name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test (90% coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit, component and integration tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/shoutout
      - run: helm lint deploy/helm/shoutout -f deploy/local/values-local.yaml
      - run: helm template ci deploy/helm/shoutout -f deploy/local/values-local.yaml > /dev/null

  image:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: App image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: shoutout:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: false
          tags: shoutout-migrate:ci
          cache-from: type=gha
