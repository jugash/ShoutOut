{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shoutout.postgres.host" . }}
  labels:
    {{- include "shoutout.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "shoutout.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
{{- end }}
