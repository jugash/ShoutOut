apiVersion: v1
kind: Pod
metadata:
  name: {{ include "shoutout.fullname" . }}-test-ready
  labels:
    {{- include "shoutout.labels" (dict "ctx" $ "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- include "shoutout.podSecurityContext" (dict "ctx" $ "runAsUser" 65534) | nindent 4 }}
  containers:
    - name: ready
      image: docker.io/library/busybox:1.37
      command: ["wget", "-qO-", "http://{{ include "shoutout.fullname" . }}-app:{{ .Values.app.service.port }}/api/ready"]
      securityContext:
        {{- include "shoutout.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 8 }}
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 32Mi }
